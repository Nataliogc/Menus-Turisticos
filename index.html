<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Menús Turísticos</title>
<style>
  :root{--theme:#0b3d20;--bg:#ffffff;--headerH:30mm;--footerH:24mm}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f5f7;color:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif}

  /* A4 sin márgenes */
  @page{size:A4;margin:0;}
  @media print{
    .app{display:none !important;}
    .page{page-break-after:always;}
    body{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }

  /* Controles */
  .app{max-width:1024px;margin:10px auto;padding:0 12px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
  .controls select,.controls input[type=file],.controls input[type=color]{padding:6px;border:1px solid #ccc;border-radius:6px;background:#fff}
  .btn{padding:9px 14px;border-radius:8px;border:0;background:#0b7a44;color:#fff;font-weight:600;cursor:pointer}
  .btn.secondary{background:#2d6cdf}
  .btn.warn{background:#b23b3b}

  /* Páginas */
  .page{width:210mm;min-height:297mm;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
  .page-header{position:absolute;top:0;left:0;width:210mm;height:var(--headerH);background:#fff;z-index:5}
  .page-header img{width:100%;height:100%;object-fit:cover;object-position:center}
  .page-footer{position:absolute;left:0;bottom:0;width:210mm;height:var(--footerH);background:#fff;z-index:5;display:flex;align-items:center;justify-content:center;padding:0 6mm}
  .page-footer img{width:100%;height:100%;object-fit:contain}
  .content{position:absolute;left:0;right:0;top:var(--headerH);bottom:var(--footerH);padding:8mm;overflow:hidden}

  /* Secciones en 2 columnas */
  .section{break-inside:avoid; page-break-inside:avoid; margin-bottom:12px}
  h2{margin:0 0 6px;font-size:18px;font-weight:700;text-transform:uppercase;background:var(--theme);color:#fff;padding:6px 10px;border-radius:4px}
  .columns{column-count:2; column-gap:28px}
  .columns ol{margin:0 0 6px 1.2rem; padding:0}
  .columns li{margin:2px 0; break-inside:avoid; page-break-inside:avoid}
  .columns ol li::marker{font-size:10px;color:#757575;font-weight:600}

  /* Alérgenos (superíndices pequeños) */
  .sup{font-size:11px;line-height:1;vertical-align:super;color:#0b2f1b;font-weight:900}
  .sep,.dash{font-size:11px;vertical-align:super;color:#0b2f1b}
  .sep{margin:0 2px}.dash{margin:0 1px}

  /* Post-it al pie de la última página */
  .pinned-note{position:absolute; left:8mm; right:8mm; bottom:6mm; z-index:4;}
  .postit{
    position:relative; background:#fff8b3; border:1px solid #e6d88a; border-radius:10px;
    padding:14px 16px; font-family:"Times New Roman",Times,serif; font-size:12pt; line-height:1.35;
    box-shadow:0 10px 18px rgba(0,0,0,.18); transform:rotate(-0.8deg);
  }
  .postit::before{content:"📌"; position:absolute; left:50%; top:-24px; transform:translateX(-50%) rotate(-12deg); font-size:22px; text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .postit::after{content:""; position:absolute; right:10px; top:8px; width:16px; height:16px; background:linear-gradient(135deg, rgba(0,0,0,.08), rgba(0,0,0,0)) no-repeat; clip-path:polygon(0 0,100% 0,100% 100%); opacity:.35}
  .content.has-note{ padding-bottom:42mm }

  /* Editor */
  .editor{border:1px solid #ddd;background:#fff;border-radius:10px;padding:12px;margin:8px auto 14px}
  .editor h4{margin:8px 0 6px}
  .editor .columns{column-gap:18px}
  .editor ol{margin:0 0 6px 1.2rem;padding:0}
  .editor li{margin:2px 0;outline:none}
  .add-btn{margin:4px 0 8px;padding:4px 8px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
  .tip{font-size:12px;color:#666;margin:6px 0 0}
  .btn:disabled{opacity:.6;cursor:wait}
  .status{font-size:12px;color:#0b7a44;min-width:90px}

  /* Separación de páginas solo en pantalla (no afecta a PDF/imagen/impresión) */
  @media screen{
    #pagesHost{padding-bottom:20px}
    #pagesHost .page{margin:0 auto 14px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
    body.exporting #pagesHost{padding-bottom:0}
    body.exporting #pagesHost .page{margin:0 auto;box-shadow:none}
  }
</style>
</head>
<body>

<div class="app">
  <div class="controls">
    <label>Cabecera:
      <select id="headerSelect">
        <option value="">Sin cabecera</option>
        <option value="img/Guadina.png" selected>Guadina.png</option>
        <option value="img/cumbria.png">cumbria.png</option>
        <option value="file">Elegir archivo…</option>
      </select>
      <input type="file" id="headerFile" accept="image/*" style="display:none">
    </label>

    <label>Portada:
      <select id="coverSelect">
        <option value="" selected>Sin portada</option>
        <option value="img/Portada Guadiana.png">Portada Guadiana.png</option>
        <option value="img/Portada Cumbria.png">Portada Cumbria.png</option>
        <option value="img/Portada Combinada.png">Portada Combinada.png</option>
        <option value="file">Elegir archivo…</option>
      </select>
      <input type="file" id="coverFile" accept="image/*" style="display:none">
    </label>

    <label>Ajuste portada:
      <select id="coverFit">
        <option value="cover">Cubrir</option>
        <option value="contain" selected>Contener</option>
      </select>
    </label>

    <label>Color títulos: <input id="themeColor" type="color" value="#0b3d20"></label>
    <label>Fondo: <input id="bgColor" type="color" value="#ffffff"></label>

    <button id="pdfBtn" class="btn" type="button">Descargar PDF</button>

    <label>Imagen:
      <select id="imgFormat">
        <option value="png" selected>PNG</option>
        <option value="jpeg">JPG</option>
      </select>
    </label>
    <label style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="perPage" checked>
      <span>Una imagen por página</span>
    </label>
    <button id="imgBtn" class="btn secondary" type="button">Descargar imagen</button>

    <button id="printBtn" class="btn secondary" type="button">Imprimir</button>
    <button id="exportJsonBtn" class="btn secondary" type="button">Guardar menú (.json)</button>
    <button id="importJsonBtn" class="btn secondary" type="button">Abrir menú (.json)</button>
    <input type="file" id="importJsonFile" accept="application/json,.json" style="display:none">

    <button id="resetBtn" class="btn warn" type="button">Restaurar base</button>
    <span id="saveStatus" class="status"></span>
  </div>

  <!-- Editor -->
  <div class="editor" id="editor">
    <div><strong>Nota final (post-it):</strong></div>
    <div id="introEdit" contenteditable="true" style="border:1px dashed #ccc;border-radius:6px;padding:8px;margin-bottom:8px"></div>

    <div class="columns">
      <div>
        <h4>PRIMEROS</h4>
        <ol id="primerosEdit"></ol>
      </div>
      <div>
        <h4>SEGUNDOS – PESCADOS</h4>
        <ol id="pescadosEdit"></ol>
        <h4>SEGUNDOS – CARNES</h4>
        <ol id="carnesEdit"></ol>
        <h4>POSTRES</h4>
        <ol id="postresEdit"></ol>
      </div>
    </div>
    <p class="tip">Clic para editar. <b>Enter</b> añade; <b>Backspace</b> en un plato vacío lo elimina. Los vacíos se omiten en el documento final. Los cambios se guardan solos en este navegador.</p>
  </div>
</div>

<!-- Páginas generadas -->
<div id="pagesHost"></div>

<!-- Librerías para exportar -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
(function(){
  /* === Config inicial === */
  const FOOTER_IMG="img/Alergenos.jpg";
  let theme='#0b3d20', headerSrc="img/Guadina.png", coverSrc="", coverFit="contain";

  const BASE={
    intro:"Honrados sean, valientes viajeros. No busquéis en estos manjares un simple sustento, sino un banquete digno de vuestras andanzas. Que esta mesa sea el inicio de una nueva aventura, compartida con honra y buena compañía. ¡Buen provecho!",
    primeros:["Sopa Juliana","Sopa de picadillo (5,7)","Sopa de pescado (1,5)","Crema de Reina (5,3,7)","Crema reina mejillón (1,3,4,5)","Crema de verduras con sus costrones (3,5)","Sopa de fideos con jamón (5)","Crema de calabaza con jamón frito y queso (3)","Judías estofadas","Patatas guisadas con calamar (4)","Cocido madrileño","Potaje de vigilia (1,5)","Patatas guisadas con ternera","Judías con perdiz","Paella mixta (1,4,14,6)","Fideua de ibéricos (5)","Arroz a la milanesa (5,3,14)","Arroz caldoso con calamar (4,6,14)","Pisto manchego con huevo frito (7)","Asadillo con huevo y atún (7,1,14)","Migas manchegas con huevo","Gazpacho andaluz (5,14)","Entremeses variados","Ensaladilla rusa con salmón (1,3,7)","Ensalada César (5,1,3,11,14)","Ensalada de tomate, cebolla roja y bonito (1,14)","Carpaccio de tomate, mozzarella y mango (3,14)","Tallarines boloñesa (5,14,3)","Lasaña de verduras (3,5)","Macarrones pomodoro (5)","Tortilla de patatas con ensalada (7)","Menestra de verduras con ajo y jamón","Judías verdes con ensalada (7,1)"],
    pescados:["Bacalao vizcaína (1,5)","Palometa con tomate (1)","Rollitos de lenguado al limón (1,3,5,14)","Merluza romana o salsa verde (1,5,4,6)","Ternera de mar con ajo y perejil (1)","Filete de corvina al azafrán (1,4,5)","Dorada donostierra (1,14)","Bonito en cama de crema de pisto (1)","Salmón a la naranja (1,3,14)","Albóndigas de sepia y gambas (1,5)"],
    carnes:["Jamón de cerdo asado","Ternera braseada con patatas panadera (14)","Caldereta de cordero","Muslo de pollo deshuesado a la brasa","Cachopo de ternera con jamón y queso (3,5,7,14)","Pechuguitas de pollo a la pimienta (11,3,14)","Ragú de ternera en salsa de verduras","Magro de cerdo con tomate","Escalopes de ternera al limón (5)","Pollo en pepitoria (2,7)","Muslo de pollo asado al limón (14)","Magras con pisto"],
    postres:["Flan casero (7,3)","Natillas caseras (7,3)","Pudin de chocolate (1,5,7)","Helado de vasito (7,14)","Babarois al limón (7,14)","Pan de calatrava (3,5,14)","Vasito Mousse de fresa (14)","Vasito Mousse chocolate y nata (14)","Tarta de queso y frutos rojos (1,14)","Arroz con leche (1,5,7)","Tarta de la casa (7,14)"]
  };
  let state=JSON.parse(JSON.stringify(BASE));

  /* === Utilidades === */
  const sup=n=>'<span class="sup">'+n+'</span>';
  const sep=()=>'<span class="sep">–</span>';
  const dash=()=>'<span class="dash">–</span>';
  function parseAllergens(t){
    return t.replace(/\(([^)]*)\)/g,(_,p)=>p.split(',').map(g=>{
      g=g.trim(); if(!g) return '';
      if(g.includes('-')){const [a,b]=g.split('-').map(s=>s.trim()); return sup(a)+dash()+sup(b);}
      return sup(g);
    }).filter(Boolean).join(sep()));
  }
  const clean=arr=>arr.map(s=>(s||'').replace(/\s+/g,' ').trim()).filter(Boolean);
  const listHTML=arr=>clean(arr).map(it=>'<li>'+parseAllergens(it)+'</li>').join('');

  /* === Editor === */
  function placeCaretAtEnd(el){const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);}
  function mountEditable(id, arrayRef){
    const ol=document.getElementById(id), box=ol.parentElement; ol.innerHTML='';
    arrayRef.forEach((txt,i)=>{
      const li=document.createElement('li'); li.textContent=txt; li.contentEditable=true;
      const val=()=>li.textContent.replace(/\s+/g,' ').trim();
      li.addEventListener('input',()=>{arrayRef[i]=val();});
      li.addEventListener('blur',()=>{if(!li.isConnected) return; const v=val(); if(v===''){arrayRef.splice(i,1); buildEditor(); render();} else {arrayRef[i]=v; render();}});
      li.addEventListener('keydown',e=>{
        if(e.key==='Enter'){e.preventDefault(); arrayRef[i]=val(); arrayRef.splice(i+1,0,''); buildEditor(); const nl=ol.querySelectorAll('li')[i+1]; if(nl) nl.focus(); render();}
        if(e.key==='Backspace' && li.textContent.trim()===''){e.preventDefault(); arrayRef.splice(i,1); buildEditor(); const pl=ol.querySelectorAll('li')[Math.max(0,i-1)]; if(pl){pl.focus(); placeCaretAtEnd(pl);} render();}
      });
      ol.appendChild(li);
    });
    if(!box.querySelector('.add-btn')){
      const btn=document.createElement('button'); btn.className='add-btn'; btn.type='button'; btn.textContent='+ Añadir';
      btn.onclick=()=>{arrayRef.push(''); buildEditor(); const lis=ol.querySelectorAll('li'); if(lis.length) lis[lis.length-1].focus();};
      box.insertBefore(btn, ol.nextSibling);
    }
  }
  function buildEditor(){
    const ie=document.getElementById('introEdit');
    ie.textContent=state.intro||''; ie.oninput=()=>{state.intro=ie.innerText.trim();}; ie.onblur=()=>{state.intro=ie.innerText.trim(); render();};
    mountEditable('primerosEdit', state.primeros);
    mountEditable('pescadosEdit', state.pescados);
    mountEditable('carnesEdit',   state.carnes);
    mountEditable('postresEdit',  state.postres);
  }

  /* === Paginado === */
  function createPage(){
    const page=document.createElement('div'); page.className='page';
    page.innerHTML='<div class="page-header"><img alt="Cabecera"></div><div class="page-footer"><img alt="Alérgenos"></div><div class="content"></div>';
    page.querySelector('.page-header img').src=headerSrc||'';
    page.querySelector('.page-footer img').src=FOOTER_IMG;
    return page;
  }
  const section=(t,items,start)=>{const d=document.createElement('div'); d.className='section'; d.innerHTML='<h2>'+t+'</h2><div class="columns"><ol'+(start>1?' start="'+start+'"':'')+'>'+listHTML(items)+'</ol></div>'; return d;};
  const MM=96/25.4; // px por mm
  const overflows=c=>c.scrollHeight>c.clientHeight+1;

  function paginate(){
    const host=document.getElementById('pagesHost'); host.innerHTML='';
    if(coverSrc){
      const p=document.createElement('div'); p.className='page';
      p.innerHTML='<img style="width:210mm;height:297mm;object-fit:'+ (coverFit==='cover'?'cover':'contain') +';display:block" src="'+coverSrc+'" alt="Portada">';
      host.appendChild(p);
    }
    let page=createPage(); host.appendChild(page);
    const content=()=>page.querySelector('.content');
    const newPage=()=>{page=createPage(); host.appendChild(page);};

    // Coloca una sección entera; si no cabe ni en una página vacía, la reparte entre páginas
    const add=(title,items)=>{
      let list=clean(items), num=1, cont=false;
      if(!list.length) return;
      while(list.length){
        const t=cont?title+' (cont.)':title;
        let c=content(), sec=section(t,list,num); c.appendChild(sec);
        if(!overflows(c)) return;
        c.removeChild(sec);
        if(c.children.length){ newPage(); c=content(); sec=section(t,list,num); c.appendChild(sec); if(!overflows(c)) return; c.removeChild(sec); }
        // Partir: meter platos uno a uno hasta llenar la página
        sec=section(t,[],num); c.appendChild(sec);
        const ol=sec.querySelector('ol'); let n=0;
        for(const it of list){
          const li=document.createElement('li'); li.innerHTML=parseAllergens(it); ol.appendChild(li);
          if(overflows(c)){ ol.removeChild(li); break; }
          n++;
        }
        if(n===0){ // ni un plato cabe: se fuerza para no entrar en bucle
          if(!c.contains(sec)) c.appendChild(sec);
          const li=document.createElement('li'); li.innerHTML=parseAllergens(list[0]); ol.appendChild(li); n=1;
        }
        list=list.slice(n); num+=n; cont=true;
        if(list.length) newPage();
      }
    };
    add('Primeros',state.primeros);
    add('Segundos – Pescados',state.pescados);
    add('Segundos – Carnes',state.carnes);
    add('Postres',state.postres);

    if(state.intro && state.intro.trim()){
      const place=()=>{
        const c=content();
        const wrap=document.createElement('div'); wrap.className='pinned-note';
        const note=document.createElement('div'); note.className='postit'; note.textContent=state.intro.trim();
        wrap.appendChild(note); c.appendChild(wrap);
        // Reserva justo el alto del post-it (más su margen y la chincheta)
        c.style.paddingBottom=(wrap.offsetHeight+6*MM+14*MM)+'px';
        return {c,wrap};
      };
      let r=place();
      if(overflows(r.c)){ r.c.removeChild(r.wrap); r.c.style.paddingBottom=''; newPage(); place(); }
    }
  }

  /* === Guardado automático (en este navegador) === */
  const STORE_KEY='menusTuristicos.v1';
  const $=id=>document.getElementById(id);
  const isPath=v=>typeof v==='string' && !v.startsWith('data:');
  function snapshot(){
    return {state, theme, bg:$('bgColor').value||'#ffffff', coverFit,
            headerSrc:isPath(headerSrc)?headerSrc:null, coverSrc:isPath(coverSrc)?coverSrc:null};
  }
  let saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); flash('Guardado ✓'); }catch(e){}
    },300);
  }
  function flash(msg){const el=$('saveStatus'); el.textContent=msg; clearTimeout(flash.t); flash.t=setTimeout(()=>el.textContent='',2000);}
  function setSelect(sel,val){ if([...sel.options].some(o=>o.value===val)) sel.value=val; }
  function applyData(d){
    if(!d || !d.state) return false;
    const st=d.state, arr=a=>Array.isArray(a)?a.map(String):[];
    state={intro:String(st.intro||''), primeros:arr(st.primeros), pescados:arr(st.pescados), carnes:arr(st.carnes), postres:arr(st.postres)};
    if(d.theme){theme=d.theme; $('themeColor').value=d.theme;}
    if(d.bg) $('bgColor').value=d.bg;
    if(d.coverFit){coverFit=d.coverFit; $('coverFit').value=d.coverFit;}
    if(d.headerSrc!==null && d.headerSrc!==undefined){headerSrc=d.headerSrc; setSelect($('headerSelect'),d.headerSrc);}
    if(d.coverSrc!==null && d.coverSrc!==undefined){coverSrc=d.coverSrc; setSelect($('coverSelect'),d.coverSrc);}
    return true;
  }
  function loadSaved(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw) applyData(JSON.parse(raw)); }catch(e){} }

  /* === Render === */
  function render(){
    document.documentElement.style.setProperty('--theme', theme);
    document.documentElement.style.setProperty('--bg', document.getElementById('bgColor').value || '#ffffff');
    paginate();
    save();
  }

  /* Bloquea los botones mientras se genera un archivo */
  async function busy(btn, fn){
    const txt=btn.textContent; btn.disabled=true; btn.textContent='Generando…';
    document.body.classList.add('exporting');
    try{ await fn(); } finally { document.body.classList.remove('exporting'); btn.disabled=false; btn.textContent=txt; }
  }

  /* === Exportar PDF === */
  document.getElementById('pdfBtn').onclick=()=>busy(document.getElementById('pdfBtn'), async()=>{
    const host=document.getElementById('pagesHost');
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
    const opt={margin:0,filename:'menu-turistico.pdf',image:{type:'jpeg',quality:0.98},
               html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false},
               jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}};
    await html2pdf().set(opt).from(host).save().catch(()=>window.print());
  });

  /* === Exportar imagen (por página o completa) === */
  document.getElementById('imgBtn').onclick = () => busy(document.getElementById('imgBtn'), async () => {
    const fmt = document.getElementById('imgFormat').value; // 'png' o 'jpeg'
    const perPage = document.getElementById('perPage').checked;
    const quality = (fmt === 'png') ? undefined : 0.96;

    const host = document.getElementById('pagesHost');
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));

    const saveCanvas = (canvas, idx) => {
      canvas.toBlob((blob) => {
        if (!blob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const suffix = perPage ? `-p${idx+1}` : '';
        a.download = `menu-turistico${suffix}.${fmt === 'png' ? 'png' : 'jpg'}`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),1200);
      }, fmt === 'png' ? 'image/png' : 'image/jpeg', quality);
    };

    if (perPage) {
      const pages = [...host.querySelectorAll('.page')];
      for (let i=0;i<pages.length;i++){
        const canvas = await html2canvas(pages[i], {scale:3, backgroundColor:'#ffffff', useCORS:true, logging:false});
        saveCanvas(canvas, i);
      }
    } else {
      const canvas = await html2canvas(host, {scale:3, backgroundColor:'#ffffff', useCORS:true, logging:false});
      saveCanvas(canvas, 0);
    }
  });

  /* === Controles === */
  document.getElementById('resetBtn').onclick=()=>{ if(!confirm('¿Restaurar base?'))return; state=JSON.parse(JSON.stringify(BASE)); buildEditor(); render(); };
  document.getElementById('headerSelect').onchange=e=>{const v=e.target.value,f=document.getElementById('headerFile'); if(v==='file'){f.style.display='inline-block';f.click();return;} f.style.display='none'; headerSrc=v; render();};
  document.getElementById('headerFile').onchange=async e=>{const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{headerSrc=r.result; render();}; r.readAsDataURL(file);};
  document.getElementById('coverSelect').onchange=e=>{const v=e.target.value,f=document.getElementById('coverFile'); if(v==='file'){f.style.display='inline-block';f.click();return;} f.style.display='none'; coverSrc=v; render();};
  document.getElementById('coverFile').onchange=async e=>{const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{coverSrc=r.result; render();}; r.readAsDataURL(file);};
  document.getElementById('coverFit').onchange=e=>{coverFit=e.target.value; render();};
  document.getElementById('themeColor').oninput=e=>{theme=e.target.value; render();};
  document.getElementById('bgColor').oninput=()=>render();

  $('printBtn').onclick=()=>window.print();

  $('exportJsonBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const d=new Date(), f=n=>String(n).padStart(2,'0');
    a.download='menu-turistico-'+d.getFullYear()+'-'+f(d.getMonth()+1)+'-'+f(d.getDate())+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1200);
  };
  $('importJsonBtn').onclick=()=>$('importJsonFile').click();
  $('importJsonFile').onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{
      try{ if(!applyData(JSON.parse(r.result))) throw 0; buildEditor(); render(); flash('Menú cargado ✓'); }
      catch(err){ alert('Ese archivo no es un menú válido.'); }
      e.target.value='';
    };
    r.readAsText(file);
  };

  /* init */
  loadSaved();
  buildEditor(); render();
})();
</script>
</body>
</html>
